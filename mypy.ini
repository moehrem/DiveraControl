[mypy]
# Python version
python_version = 3.12

# Module discovery
mypy_path = custom_components
namespace_packages = True
explicit_package_bases = True

# Import discovery
ignore_missing_imports = True
follow_imports = normal

# Platform configuration
platform = linux

# Strictness settings - pragmatic level for custom components
warn_return_any = False
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False

# Disable overly strict checks for custom components
check_untyped_defs = False
disallow_untyped_calls = False
disallow_any_generics = False

# Allow flexible typing
allow_redefinition = True
implicit_reexport = True

# Show error codes
show_error_codes = True
show_column_numbers = True

# Per-module overrides for test files
[mypy-tests.*]
ignore_errors = True

# Per-module overrides for Home Assistant
[mypy-homeassistant.*]
ignore_missing_imports = True

# Per-module overrides for third-party libraries
[mypy-aiohttp.*]
ignore_missing_imports = True

[mypy-voluptuous.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True
