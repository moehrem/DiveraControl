version: 2

updates:
  # Python-Abhängigkeiten (requirements.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    versioning-strategy: "increase-if-necessary"
    groups:
      # Home Assistant und das passende pytest-Plugin müssen immer
      # synchron gebumpt werden -> gemeinsam in einem PR.
      home-assistant:
        patterns:
          - "homeassistant"
          - "pytest-homeassistant-custom-component"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"

  # GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
