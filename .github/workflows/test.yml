name: Tests

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
          cache-dependencies: "true"

      - name: Install dependencies
        run: pip install pytest pytest-cov pytest-homeassistant-custom-component homeassistant aiohttp

      - name: Run tests with coverage
        run: |
          PYTHONPATH=. pytest tests/ \
            --cov=custom_components.diveracontrol \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella