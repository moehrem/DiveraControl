name: Release asset

on:
  workflow_dispatch:

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build and upload ZIP asset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build HACS ZIP
        run: |
          mkdir -p dist
          cd custom_components/diveracontrol
          zip -r ../../dist/DiveraControl.zip . \
            -x "*/__pycache__/*" "*.pyc"

      - name: Upload asset to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DiveraControl.zip
