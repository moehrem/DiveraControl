name: ✅ CI Pipeline

on:
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: "0 3 * * 1" # Läuft jeden Montag um 03:00 UTC für automatische Updates

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: "🔍 Linting & Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.11"
          cache-dependencies: "true"

      - name: Install ruff
        run: pip install ruff

      - name: Autoformat with Black
        run: black . --line-length=88 --fast

      - name: Run ruff
        run: ruff check custom_components/diveracontrol

  security_checks:
    name: "🔒 Security Checks"
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.13"
          cache-dependencies: "true"

      - name: 🔒 Install Security Tools
        run: pip install bandit pip-audit

      - name: 🔍 Run Bandit (Code Security)
        run: bandit -r custom_components/ -ll -i

      - name: 🛡️ Run pip-audit (Dependency Security)
        run: pip-audit

  secrets_scan:
    name: "🕵️ Secret Scanning"
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐽 TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.88.6
        with:
          head: HEAD
          extra_args: "--only-verified --json"
