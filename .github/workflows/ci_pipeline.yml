name: ✅ CI Pipeline

on:
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: "0 3 * * 1" # Jeden Montag um 03:00 UTC

permissions:
  contents: read
  # Falls später Codecov/Artifacts hinzugefügt werden:
  # id-token: write
  # actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: "🔍 Linting & Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 100

      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
          cache-dependencies: "true"

      - name: Install Linting Tools
        run: |
          pip install \
            ruff==0.4.4 \
            black==24.3.0

      - name: Autoformat with Black
        run: black . --line-length=88 --fast

      - name: Run ruff
        run: ruff check custom_components/diveracontrol --output-file=ruff-results.txt
        continue-on-error: true

      - name: Upload ruff Results (Artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruff-results
          path: ruff-results.txt

  security_checks:
    name: "🔒 Security Checks"
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # ✅ Token explizit übermitteln

      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
          cache-dependencies: "true"

      - name: Install Security Tools
        run: |
          pip install \
            bandit==1.7.8 \
            pip-audit==2.6.3

      - name: Run Bandit (Code Security)
        run: bandit -r custom_components/diveracontrol -ll -ii -f json -o bandit-results.json
        continue-on-error: true

      - name: Run pip-audit (Dependency Security)
        run: pip-audit --strict --format=json --output=pip-audit-results.json
        continue-on-error: true

      - name: Upload Security Reports (Artifacts)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-results.json
            pip-audit-results.json

  secrets_scan:
    name: "🕵️ Secret Scanning"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (Full History)
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 100
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.88.6
        with:
          head: HEAD
          extra_args: "--only-verified --json --fail"